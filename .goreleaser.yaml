# goreleaser config for cs-npmrevs: a CGO_ENABLED=0 static
# multi-arch binary, checksummed + SBOM'd + cosign-signed releases (supply chain).
#
#   goreleaser check                                # validate this file
#   goreleaser build --single-target --snapshot --clean --output bin/cs-npmrevs
#   goreleaser release --snapshot --clean           # full local dry-run (dist/)
#   goreleaser release --clean                      # tagged release (needs a git tag)
version: 2

project_name: cs-npmrevs

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: cs-npmrevs
    main: ./cmd/cs-npmrevs
    binary: cs-npmrevs
    env:
      - CGO_ENABLED=0 # static, no cgo
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Linux and macOS, both architectures: darwin/amd64 costs nothing to add and
    # is what an Intel Mac still needs.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - id: cs-npmrevs
    ids:
      - cs-npmrevs
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - INSTALL.md
      - MANUAL.md
      - SPEC.md
      - CONTRIBUTING.md
      - LICENSE
      # Apache 2.0 section 4(d) obliges every redistributor to carry NOTICE, and
      # a release archive is a redistribution.
      - NOTICE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Software bill of materials per archive (supply chain). Requires cyclonedx-gomod:
#   go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: cyclonedx-gomod
    args: ["app", "-json", "-output", "$document", "-main", "cmd/cs-npmrevs", "../../.."]

# Keyless cosign signing of the checksums (supply chain). Requires cosign; runs
# in release mode, with the ambient OIDC identity CI provides.
signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: '{{ with index .Env "VERSION" }}{{ . }}{{ else }}{{ .ShortCommit }}{{ end }}'

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "merge conflict"

release:
  draft: true
  name_template: "cs-npmrevs {{ .Tag }}"
  header: |
    ## cs-npmrevs {{ .Tag }}

    Package, resolve and serve each revision's build of an npm package, so a
    team of AI coding agents can install work in progress.

    Static `CGO_ENABLED=0` binaries; verify with `checksums.txt` (+ cosign `.sig`).
